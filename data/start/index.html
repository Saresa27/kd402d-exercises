<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 44rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h2 {
        margin-top: 2rem;
        font-size: 1.1rem;
      }
      button {
        font-size: 1rem;
        padding: 0.4rem 1rem;
        margin: 0 0.4rem 0.6rem 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Data</h1>
    <p>
      Each button plays one exercise: button 1 plays <code>exercise1.js</code>, and so on. Open the
      browser console to see what the code logs.
    </p>

    <h2>Block 1: notes as data</h2>
    <button id="play-1">1 · Store a sound</button>
    <button id="play-2">2 · A note from parts</button>
    <button id="play-3">3 · Tempo</button>
    <button id="play-4">4 · Variables as arguments</button>

    <h2>Block 2: transforming musical data</h2>
    <button id="play-6">6 · Same number, different jobs</button>
    <button id="play-7">7 · A chord</button>
    <button id="play-8">8 · Bug hunt</button>

    <h2>Purple track: a generative piece</h2>
    <p>In <code>generative.js</code>.</p>
    <button id="piece-play">Play the piece</button>
    <button id="piece-stop">Stop</button>

    <!-- Tone.js: the library from Tuesday afternoon. It needs an internet connection. -->
    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    <script src="setup.js"></script>
    <script src="exercise1.js"></script>
    <script src="exercise2.js"></script>
    <script src="exercise3.js"></script>
    <script src="exercise4-5.js"></script>
    <script src="exercise6.js"></script>
    <script src="exercise7.js"></script>
    <script src="exercise8.js"></script>
    <script src="blue.js"></script>
    <script src="generative.js"></script>
  </body>
</html>
